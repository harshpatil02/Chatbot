<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guardrail RAG — Chat</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h1>Guardrail RAG</h1>
      <p class="muted">Retrieval-augmented chatbot</p>
      <div class="controls">
        <label>LLM Provider</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="azure">Azure</option>
          <option value="google">Google</option>
        </select>
      </div>
    </aside>

    <main class="chat">
      <div class="chat-header">
        <div>
          <h2>Chat</h2>
          <p class="muted">Ask anything — the system will retrieve supporting docs.</p>
        </div>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="composer" class="composer">
        <textarea id="query" placeholder="Ask a question..." rows="2"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
