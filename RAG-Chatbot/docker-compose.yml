version: '3.9'
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: guardrail-rag-db
    environment:
      POSTGRES_DB: ${DB_NAME:-guardrail_rag}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-guardrail_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: guardrail-rag-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-guardrail_rag}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
